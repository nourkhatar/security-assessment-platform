apiVersion: v1
kind: Namespace
metadata:
  name: security-poc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-web
  namespace: security-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-web
  template:
    metadata:
      labels:
        app: vulnerable-web
    spec:
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
          securityContext:
            runAsUser: 0
            privileged: false
          env:
            - name: DEMO_SECRET
              value: "poc-only-value"
